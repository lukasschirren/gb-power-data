# Technology parameters for agent construction (Stage 3). Editable, not hardcoded.
# SRMC = fuel_price/efficiency + carbon_price * emissions_factor/efficiency + vom

# Electrical efficiency (used when PPM Efficiency is missing AND no DateIn for the
# vintage curve below, or for non-gas fuels).
efficiency_defaults:
  CCGT: 0.50
  OCGT: 0.35
  Hard Coal: 0.36
  Oil: 0.35
  Solid Biomass: 0.38
  Biomass: 0.38
  Waste: 0.28
  Nuclear: 0.33

# Vintage-sloped efficiency for gas plant WITHOUT a measured PPM Efficiency. The flat
# defaults made the CCGT stack horizontal (34/37 agents at 0.50) -> no demand->price
# response within the day. Anchors are (commissioning_year, electrical_efficiency),
# linearly interpolated by DateIn and clamped outside the range. Grounded in the
# powerplantmatching efficiency-vs-DateIn trend (CCGT-ish medians ~0.52 in the late
# 1990s/2000s rising to ~0.56 by the mid-2010s, ~0.5pp/yr) plus CCGT engineering history.
efficiency_vintage:
  CCGT:                 # spread AROUND the 0.50 default (fleet cap-wtd mean ~0.50, data
    - [1990, 0.46]      # mean 0.502) so it adds slope/heterogeneity without re-levelling
    - [2000, 0.49]
    - [2010, 0.52]
    - [2020, 0.55]
  OCGT:
    - [1990, 0.30]
    - [2010, 0.36]
    - [2020, 0.39]

# Fuel carbon content, tCO2 per MWh-thermal (divided by efficiency in SRMC).
emissions_factor:
  Natural Gas: 0.184
  Hard Coal: 0.340
  Oil: 0.280
  Solid Biomass: 0.0      # carbon-neutral under UK ETS
  Biomass: 0.0
  Waste: 0.0
  Nuclear: 0.0
  Wind: 0.0
  Solar: 0.0
  Hydro: 0.0
  Battery: 0.0

# Representative RO support value, GBP/MWh (2023-24 buyout ~GBP 59/ROC x banding).
roc_value:
  Wind: 65.0
  Solar: 70.0
  Solid Biomass: 60.0
  Hydro: 55.0
  Waste: 30.0
  default: 50.0

# LCCC CfD-fleet technology -> model technology / fuel labels.
cfd_tech_map:
  Offshore Wind:      {tech: Wind, fuel: Wind, offshore: true}
  Onshore Wind:       {tech: Wind, fuel: Wind, offshore: false}
  Solar PV:           {tech: Solar, fuel: Solar, offshore: false}
  Biomass Conversion: {tech: Biomass, fuel: Solid Biomass, offshore: false}
  Dedicated Biomass:  {tech: Biomass, fuel: Solid Biomass, offshore: false}
  Energy from Waste:  {tech: Waste, fuel: Waste, offshore: false}
